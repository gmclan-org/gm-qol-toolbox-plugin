name: Release

# Publishes a GitHub Release automatically whenever a "vX.Y.Z" tag is
# pushed. The Release body is the matching "## vX.Y.Z" section from
# CHANGELOG.md (a short, human-written "what's new" summary), with
# GitHub's own auto-generated commit list appended below it for anyone
# who wants the full detail. The DLL/manifest/install scripts are
# attached as named assets so they're easy to grab individually - GitHub
# also always attaches its own auto-generated "Source code (zip/tar.gz)"
# archive to every release, no extra step needed for that.
#
# Requires CHANGELOG.md to have a "## vX.Y.Z" entry matching the pushed
# tag *before* tagging - if missing, the release body falls back to
# just the auto-generated commit list.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this tag
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            GmclanToolboxPlugin.dll
            GmclanToolboxPlugin.gmplugin
            install.ps1
            uninstall.ps1
