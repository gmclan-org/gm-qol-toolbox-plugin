name: Release

# Publishes a GitHub Release automatically whenever a "vX.Y.Z" tag is
# pushed. Release notes are auto-generated from commits since the
# previous tag. The DLL/manifest/install scripts are attached as named
# assets so they're easy to grab individually - GitHub also always
# attaches its own auto-generated "Source code (zip/tar.gz)" archive to
# every release, no extra step needed for that.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GmclanToolboxPlugin.dll
            GmclanToolboxPlugin.gmplugin
            install.ps1
            uninstall.ps1
