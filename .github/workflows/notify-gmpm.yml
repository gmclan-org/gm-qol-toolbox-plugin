name: Notify GMPM registry

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook
        run: |
          BODY='{"gh_user":"${{ github.repository_owner }}","gh_repo":"${{ github.event.repository.name }}"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | sed 's/^.* //')"
          curl -sf -X POST "http://gmpm.gmclan.org/webhook.php" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY"
